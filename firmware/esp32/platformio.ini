[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; Build configuration
build_unflags =
  -std=gnu++11

; Upload configuration (ESP32-S3 native USB can be finicky)
; - Slower baud improves reliability on some cables/ports
; - usb_reset helps when auto-reset fails and you otherwise get:
;   "Failed to connect to ESP32-S3: No serial data received."
upload_speed = 115200
upload_flags =
  --before
  usb_reset
  --after
  hard_reset

build_flags =
  -DCORE_DEBUG_LEVEL=0
  ; Use USB-Serial/JTAG port (shows as "USB JTAG/serial debug unit" on macOS).
  ; This makes prints visible on /dev/cu.usbmodem* even when CDC isn't enumerated.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_SERIAL_JTAG_ON_BOOT=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -std=gnu++17
  ; NOTE: Do not use -mfloat-abi=hard on ESP32-S3 (xtensa toolchain).
  ; It is not recognized by xtensa-esp32s3-elf-g++ and will fail compilation.
  ; Optimization for inference speed
  -O2

; Memory configuration for ESP32-S3-N8R8
; N8R8 = 8MB Flash + 8MB PSRAM
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv

; Dependencies
lib_deps =
  ; ArduinoJson for result serialization (optional)
  bblanchon/ArduinoJson@^6.21.0

; Extra scripts (optional - for model deployment)
; extra_scripts = pre:scripts/prepare_model.py
